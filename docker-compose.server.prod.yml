# rondo リアルタイム基盤（Gleam / mist）の本番（prod）構成（issue-35）。
#
# A1 のリポジトリの作業コピーで、docker compose を直接実行して使う（deploy/a1-deploy.sh ws）。
# Coolify のアプリにはしない。コンテナ名を rondo-ws に固定し、再デプロイしても A1 の Traefik 動的設定
# （docs/ops/traefik-rondo.yaml）が外れないようにする。
#
# ルーティングは Traefik の動的設定ファイルで行うため、ここには Traefik のラベルを書かない。
# ホストへのポート公開もしない（coolify ネットワークの中で、コンテナ名で届く）。
# 手順は docs/deploy.md。

services:
  rondo-ws:
    container_name: rondo-ws
    build:
      # ビルドは server/ を起点にする（Gleam プロジェクトだけで完結する）。
      context: ./server
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - coolify
    restart: unless-stopped
    # メモリの上限（issue-51）。極端に大きな電文への最後の砦。ふだんの使用は数十 MB で、
    # ソケット1本ごとの上限（connection/heap_guard: 64 MiB）が先に効くので、ここには当たらない。
    # 同時に多数の接続が極端な電文を送る、まれな場合にだけ当たり、コンテナごと落ちて
    # restart: unless-stopped で再起動する（全員が切れるが、再接続できる）。A1 の空きに対して
    # 十分小さく、ソケット1本の上限が先に効くだけの余裕を取った値。必要なら増減してよい。
    mem_limit: 1g
    mem_reservation: 256m

networks:
  coolify:
    external: true
