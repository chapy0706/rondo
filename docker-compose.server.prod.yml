# rondo リアルタイム基盤（Gleam / mist）の本番（prod）構成（issue-35）。
#
# Coolify の Build Pack = Docker Compose、Docker Compose Location = /docker-compose.server.prod.yml
# で使う。コンテナ名を rondo-ws に固定し、再デプロイしても A1 の Traefik 動的設定
# （docs/ops/traefik-rondo.yaml）が外れないようにする。
#
# ルーティングは Traefik の動的設定ファイルで行うため、ここには Traefik のラベルを書かない。
# ホストへのポート公開もしない（coolify ネットワークの中で、コンテナ名で届く）。
# 手順は docs/deploy.md。

services:
  rondo-ws:
    container_name: rondo-ws
    build:
      # ビルドは server/ を起点にする（Gleam プロジェクトだけで完結する）。
      context: ./server
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true
