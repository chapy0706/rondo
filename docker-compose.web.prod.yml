# rondo フロント（Next.js）の本番（prod）構成（issue-35）。
#
# A1 のリポジトリの作業コピーで、docker compose を直接実行して使う（deploy/a1-deploy.sh web）。
# Coolify のアプリにはしない。コンテナ名を rondo-app に固定し、再デプロイしても A1 の Traefik 動的設定
# （docs/ops/traefik-rondo.yaml）が外れないようにする。
#
# ルーティングは Traefik の動的設定ファイルで行うため、ここには Traefik のラベルを書かない。
# ホストへのポート公開もしない（coolify ネットワークの中で、コンテナ名で届く）。
# 手順は docs/deploy.md。

services:
  rondo-app:
    container_name: rondo-app
    build:
      # ビルドはリポジトリ直下を起点にする（pnpm ワークスペース全体が要る）。
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # リアルタイム基盤（Gleam）に繋ぐときだけ設定する。値は、リポジトリの外の env ファイル
        # から --env-file で渡す（deploy/a1-deploy.sh）。未設定ならモック動作（サーバー不要）のまま。
        NEXT_PUBLIC_RONDO_WS_URL: "${NEXT_PUBLIC_RONDO_WS_URL:-}"
        # 素材の配信の基準 URL（issue-43）。未設定なら素材は読み込まず、仮の表示で動く。
        NEXT_PUBLIC_ASSET_BASE_URL: "${NEXT_PUBLIC_ASSET_BASE_URL:-}"
    expose:
      - "3000"
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true
