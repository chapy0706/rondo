<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロゴの見本（issue-69）</title>
<!--
  ゲームのロゴの確認用の見本（issue-69）。本番には出さない（tools/ の下の静的な HTML）。
  このファイルをブラウザで直接開く（file://）。ロゴは apps/web/public/games/<識別子>/logo.svg を
  そのまま読むので、SVG を直したら、再読み込みで見直せる。
  角の丸め（22%）は、画面の部品（apps/web/src/platform/brand/GameLogo.tsx）と同じ。
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; }
  section { padding: 24px 16px; }
  section.light { background: #f4f2ee; color: #13111f; }
  section.dark { background: #13111f; color: #ece8f5; }
  h2 { margin: 0 0 16px; font-size: 18px; }
  h3 { margin: 16px 0 8px; font-size: 14px; font-weight: 600; opacity: 0.8; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  figcaption { font-size: 12px; text-align: center; }
  img { display: block; border-radius: 22%; }
  .s160 img { width: 160px; height: 160px; }
  .s48 img { width: 48px; height: 48px; }
</style>
</head>
<body>
<section class="light">
  <h2>明るい背景</h2>
  <h3>160 px（選択画面のカード）</h3>
  <div class="row s160" data-size="160"></div>
  <h3>48 px（小さな表示の目安）</h3>
  <div class="row s48" data-size="48"></div>
</section>
<section class="dark">
  <h2>暗い背景</h2>
  <h3>160 px（選択画面のカード）</h3>
  <div class="row s160" data-size="160"></div>
  <h3>48 px（小さな表示の目安）</h3>
  <div class="row s48" data-size="48"></div>
</section>
<script>
  // 登録（apps/web/src/games/*/manifest.ts）と同じ並びと名前。
  const games = [
    ["veryare", "すごくアレ"],
    ["czz", "指示厨ゲーム"],
    ["tetris", "テ〇〇ス"],
    ["tilt-maze", "ころころ迷路"],
    ["nikaku-keshi", "二角消去"],
    ["minichess", "ミニチェス"],
  ];
  for (const row of document.querySelectorAll(".row")) {
    for (const [id, name] of games) {
      const figure = document.createElement("figure");
      const img = document.createElement("img");
      img.src = `../apps/web/public/games/${id}/logo.svg`;
      img.alt = name;
      const caption = document.createElement("figcaption");
      caption.textContent = `${name}（${id}）`;
      figure.append(img, caption);
      row.append(figure);
    }
  }
</script>
</body>
</html>
