<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<rect width="512" height="512" fill="#ffe3dc"/>
<!-- コマンドの画面（白い角丸の板と、少しずらした影）。 -->
<rect x="112" y="152" width="300" height="220" rx="28" fill="#f2c4b8"/>
<rect x="100" y="140" width="300" height="220" rx="28" fill="#ffffff"/>
<!-- カーソル「>_」（朱。図形だけで描く）。 -->
<polygon points="150,200 222,250 150,300 150,272 184,250 150,228" fill="#c8553d"/>
<rect x="236" y="276" width="76" height="24" fill="#c8553d"/>
<!-- 指し棒（斜めの棒。朱）。先をカーソルへ向ける。 -->
<rect x="300" y="300" width="190" height="16" rx="8" transform="rotate(-38 300 308)" fill="#c8553d"/>
</svg>
