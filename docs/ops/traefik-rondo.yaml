# rondo の Traefik 動的設定の見本（issue-35）。
#
# A1 の /data/coolify/proxy/dynamic/rondo.yaml に、この内容を置く（docs/deploy.md の「初回の起動手順」）。
# Traefik は Coolify のプロキシ（coolify-proxy）をそのまま使う。rondo 自体は Coolify のアプリにしない。
# ファイルの末尾には空行を1つ残すこと。
#
# - compose（docker-compose.*.prod.yml）でコンテナ名を rondo-app / rondo-ws に固定している
#   ので、再デプロイしてもこの設定は書き換えなくてよい
# - compose のラベルには頼らず、ここで振り分ける（設定を1か所にまとめるため）
# - 外からの経路は Cloudflare Tunnel → A1 の Traefik（80 番 / entryPoint: http）。
#   TLS は Cloudflare 側で終端するので、ここでは http の入口だけを使う
# - WebSocket（ws-rondo の /ws）は、Traefik が Upgrade をそのまま通すので追加設定は要らない
# - 素材の配信（assets-rondo、issue-43）は rondo-assets へ。CORS とキャッシュのヘッダは
#   rondo-assets（nginx）が付けるので、ここでは振り分けだけをする

http:
  routers:
    rondo-app:
      rule: Host(`rondo.chapy0706.com`)
      entryPoints:
        - http
      service: rondo-app
    rondo-ws:
      rule: Host(`ws-rondo.chapy0706.com`)
      entryPoints:
        - http
      service: rondo-ws
    rondo-assets:
      rule: Host(`assets-rondo.chapy0706.com`)
      entryPoints:
        - http
      service: rondo-assets

  services:
    rondo-app:
      loadBalancer:
        servers:
          - url: http://rondo-app:3000
    rondo-ws:
      loadBalancer:
        servers:
          - url: http://rondo-ws:3000
    rondo-assets:
      loadBalancer:
        servers:
          - url: http://rondo-assets:3000

